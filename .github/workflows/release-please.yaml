name: release-please

on:
  push:
    branches: [main]

# Read-only by default; each job below elevates only what it needs.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/yornik/soiree

# Every action is pinned to a commit digest, not a tag: a tag is mutable and
# whoever can move it can run arbitrary code with this workflow's token. The
# trailing comment is the human-readable version, and is the exact format
# Renovate reads and rewrites (helpers:pinGitHubActionDigests in renovate.json).

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp

  # The release commit passes the same jobs every change passes, before an
  # image of it exists. Until this ran, `image` waited only for the job that
  # made the tag, and v1.1.0 and v1.2.1 went out as `:latest`, signed, from
  # commits whose own run on main was red. The tag and the GitHub Release are
  # already made by the time this starts, so what a red run withholds is the
  # image: re-run the failed jobs for a flake, fix forward for anything else.
  checks:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/checks.yaml

  # release-please tags via GITHUB_TOKEN (which can't trigger a separate
  # tag-triggered workflow), so build + push the release image in this run.
  #
  # Consequence for verification: this run is a push to main, so the signing
  # identity ends @refs/heads/main, not @refs/tags/vX.Y.Z. See
  # docs/verifying-releases.md.
  image:
    needs: [release-please, checks]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # The group ci.yaml's release-image job is in, for the reason written
    # there: it keeps the two jobs out of the registry at the same time, and a
    # group serialises only against itself, so the name has to be the same one
    # in both files. Which digest `:latest` ends on is the step below's doing,
    # not this group's.
    concurrency:
      group: release-image
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      # Keyless cosign: the OIDC token is the signing identity, so there is no
      # long-lived key anywhere. Needed only by this job.
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The floating tag moves only for the newest release, for the reason and
      # with the caveat written beside the same step in ci.yaml. This path
      # releases what main has just merged, which is usually the highest
      # version there is, but not when a re-run publishes it after a later
      # release or when a tag pushed by hand is higher.
      - name: Decide whether this release moves :latest
        id: tags
        env:
          VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          newest=$(git ls-remote --tags --refs --sort=-v:refname origin 'v*' |
            awk 'NR == 1 { sub(/.*refs\/tags\//, "", $2); print $2 }')
          if [ -z "$newest" ]; then
            echo "::error::origin carries no vX.Y.Z tag, so there is nothing to compare $VERSION against"
            exit 1
          fi
          highest=$(printf '%s\n%s\n' "$newest" "$VERSION" | sort -V | tail -n 1)
          {
            echo 'list<<END_OF_TAG_LIST'
            echo "${IMAGE}:${VERSION}"
            if [ "$highest" = "$VERSION" ]; then
              echo "${IMAGE}:latest"
            fi
            echo END_OF_TAG_LIST
          } >> "$GITHUB_OUTPUT"
          if [ "$highest" != "$VERSION" ]; then
            echo "::warning::$newest is a later release than $VERSION, so :latest was left where it is"
          fi

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            VERSION=${{ needs.release-please.outputs.tag_name }}
            COMMIT=${{ github.sha }}
          # Ship a bill of materials and build provenance with the image, so
          # what is in a release is verifiable rather than asserted.
          sbom: true
          provenance: mode=max
          # No cache: every job that runs on main can write the shared Actions
          # cache, so a layer restored from it is a way for code that is not in
          # this repository to reach a signed image. It would save the module
          # download and nothing else, since the source and the version stamp
          # change on every release.

      # The cosign version is whatever this action pins (see its action.yml), so
      # digest-pinning the action pins cosign too.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the index digest, which is what both tags resolve to.
      - name: Sign the image (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Run the exact command docs/verifying-releases.md tells third parties to
      # run. github.workflow_ref expands to the documented certificate identity
      # (Yornik/soiree/.github/workflows/release-please.yaml@refs/heads/main),
      # so if the doc is wrong or the signature is unusable, the release fails
      # here rather than in someone else's admission controller.
      - name: Verify the signature the way a third party would
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          for ref in "${IMAGE}@${DIGEST}" "${IMAGE}:${TAG}"; do
            cosign verify \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$ref" > /dev/null
            echo "verified (exact identity): $ref"
          done
          # The regexp form is what a reader who does not know which workflow
          # cut the release will paste. Kept byte-identical to the doc so this
          # fails if the two drift apart.
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/Yornik/soiree/\.github/workflows/(release-please|ci)\.yaml@refs/(heads/main|tags/v.+)$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-repository 'Yornik/soiree' \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "verified (documented regexp form): ${IMAGE}@${DIGEST}"

  # Separate job purely so contents:write lives nowhere near the build. The SBOM
  # is already attached to the image as an attestation; this republishes that
  # same document as a release asset so it can be read without pulling anything.
  sbom:
    needs: [release-please, image]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the SBOM attestation from the pushed image
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
            --format '{{ json .SBOM }}' > sbom.raw.json
          # Single-platform builds nest the document under .SPDX; multi-platform
          # ones key it by platform first. Accept either, reject anything else.
          jq 'if has("SPDX") then .SPDX
              else ([.[] | select(type == "object" and has("SPDX")) | .SPDX] | first)
              end' sbom.raw.json > "soiree-${TAG}-sbom.spdx.json"
          # Fail loudly rather than attaching an empty or null asset.
          jq -e '.spdxVersion and (.packages | length > 0)' \
            "soiree-${TAG}-sbom.spdx.json" > /dev/null
          echo "extracted SBOM for ${IMAGE}@${DIGEST}"

      - name: Attach the SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "soiree-${TAG}-sbom.spdx.json" --clobber
