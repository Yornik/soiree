name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.26'

jobs:
  lint:
    name: Lint (golangci-lint)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: gofmt -l . | tee /tmp/fmt.out && test ! -s /tmp/fmt.out
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    name: Test (go test)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -race -cover ./...

  build:
    name: Build image (validate)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: soiree:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A green unit test suite does not prove the image boots. Start it and
      # check that configuration actually reaches the rendered page.
      - name: Smoke test the image
        run: |
          docker run -d --name soiree-ci -p 8080:8080 \
            -e SOIREE_EVENT_NAME='CI Smoke Test' \
            -e SOIREE_EVENT_DATE='2030-01-01T00:00:00Z' \
            soiree:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q 'CI Smoke Test'
          curl -fsS http://localhost:8080/sw.js >/dev/null
          echo "image serves configured content"
          docker rm -f soiree-ci

  # Reliable release path: pushing a vX.Y.Z tag builds + pushes the semver
  # image. (release-please's own tags are made with GITHUB_TOKEN, so it builds
  # the image inside release-please.yaml instead; this covers manual releases.)
  release-image:
    name: Push release image
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/yornik/soiree:${{ github.ref_name }}
            ghcr.io/yornik/soiree:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
