name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/yornik/soiree

# Every action is pinned to a commit digest, not a tag: a tag is mutable and
# whoever can move it can run arbitrary code with this workflow's token. The
# trailing comment is the human-readable version, and is the exact format
# Renovate reads and rewrites (helpers:pinGitHubActionDigests in renovate.json).

jobs:
  # The jobs every change has to pass, in a workflow both release paths call
  # so that nothing is published ahead of them. A tag push used to run none of
  # them: each check carried an `if` that skipped it on a tag ref, which left
  # the job below free to push and sign whatever the tag pointed at.
  checks:
    uses: ./.github/workflows/checks.yaml

  # Reliable release path: pushing a vX.Y.Z tag builds + pushes the semver
  # image. (release-please's own tags are made with GITHUB_TOKEN, so it builds
  # the image inside release-please.yaml instead; this covers manual releases.)
  release-image:
    name: Push and sign release image
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign: the OIDC token is the signing identity, so there is no
      # long-lived key anywhere. Needed only by this job.
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The step below compares two histories, and the default fetch is one
          # commit deep, which shares none of either.
          fetch-depth: 0

      # The checks above say the tagged tree passes its own tests; they say
      # nothing about how that tree got there. A `v*` tag can be pushed at any
      # commit in the repository, including one on a branch that never opened a
      # pull request, and this job would sign that commit and move `:latest`
      # onto it. The other release path builds what main has just merged, so
      # this is the only door that needs the lock.
      - name: Refuse a tag whose commit is not on main
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not reachable from main, so nothing on the branch ever saw it; no image was pushed"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          sbom: true
          provenance: mode=max
          # No cache: every job that runs on main can write the shared Actions
          # cache, so a layer restored from it is a way for code that is not in
          # this repository to reach a signed image. It would save the module
          # download and nothing else, since the source and the version stamp
          # change on every release.

      # The cosign version is whatever this action pins (see its action.yml), so
      # digest-pinning the action pins cosign too.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the index digest, which is what both tags resolve to.
      - name: Sign the image (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Run the exact command docs/verifying-releases.md tells third parties to
      # run. github.workflow_ref expands to the documented certificate identity
      # (Yornik/soiree/.github/workflows/ci.yaml@refs/tags/vX.Y.Z), so if the
      # doc is wrong or the signature is unusable, the release fails here.
      - name: Verify the signature the way a third party would
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          for ref in "${IMAGE}@${DIGEST}" "${IMAGE}:${TAG}"; do
            cosign verify \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$ref" > /dev/null
            echo "verified (exact identity): $ref"
          done
          # The regexp form is what a reader who does not know which workflow
          # cut the release will paste. Kept byte-identical to the doc so this
          # fails if the two drift apart.
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/Yornik/soiree/\.github/workflows/(release-please|ci)\.yaml@refs/(heads/main|tags/v.+)$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-repository 'Yornik/soiree' \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "verified (documented regexp form): ${IMAGE}@${DIGEST}"

  # Separate job purely so contents:write lives nowhere near the build. The SBOM
  # is already attached to the image as an attestation; this republishes that
  # same document as a release asset so it can be read without pulling anything.
  release-sbom:
    name: Publish SBOM as a release asset
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: release-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the SBOM attestation from the pushed image
        env:
          DIGEST: ${{ needs.release-image.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
            --format '{{ json .SBOM }}' > sbom.raw.json
          # Single-platform builds nest the document under .SPDX; multi-platform
          # ones key it by platform first. Accept either, reject anything else.
          jq 'if has("SPDX") then .SPDX
              else ([.[] | select(type == "object" and has("SPDX")) | .SPDX] | first)
              end' sbom.raw.json > "soiree-${TAG}-sbom.spdx.json"
          # Fail loudly rather than attaching an empty or null asset.
          jq -e '.spdxVersion and (.packages | length > 0)' \
            "soiree-${TAG}-sbom.spdx.json" > /dev/null
          echo "extracted SBOM for ${IMAGE}@${DIGEST}"

      - name: Attach the SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "soiree-${TAG}-sbom.spdx.json" --clobber
          else
            echo "::notice::no GitHub Release exists for $TAG, so there is nothing to attach the SBOM to; it remains available as an image attestation"
          fi
