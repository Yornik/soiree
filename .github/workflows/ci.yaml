name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/yornik/soiree

# Every action is pinned to a commit digest, not a tag: a tag is mutable and
# whoever can move it can run arbitrary code with this workflow's token. The
# trailing comment is the human-readable version, and is the exact format
# Renovate reads and rewrites (helpers:pinGitHubActionDigests in renovate.json).

jobs:
  # The jobs every change has to pass, in a workflow both release paths call
  # so that nothing is published ahead of them. A tag push used to run none of
  # them: each check carried an `if` that skipped it on a tag ref, which left
  # the job below free to push and sign whatever the tag pointed at.
  checks:
    uses: ./.github/workflows/checks.yaml

  # Reliable release path: pushing a vX.Y.Z tag builds + pushes the semver
  # image. (release-please's own tags are made with GITHUB_TOKEN, so it builds
  # the image inside release-please.yaml instead; this covers manual releases.)
  release-image:
    name: Push and sign release image
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: checks
    runs-on: ubuntu-latest
    # Which digest `:latest` ends on is decided by the step below, not here:
    # all this group does is keep the two publish jobs out of the registry at
    # the same time, and a group serialises only against itself, so the name is
    # shared with release-please.yaml. It does not make the publish order the
    # release order, because a job joins its group once `needs` is satisfied,
    # so a re-run of a flaked check joins it long after the later release has
    # landed (the instruction to re-run one is in release-please.yaml). It sits
    # on the job rather than on the workflow so that what queues is the push
    # and the signature, a couple of minutes, rather than the whole suite: while
    # one run waits, a third release joining cancels the one that waits, and
    # that version gets no image at all. cancel-in-progress stays false, since
    # stopping a release between pushing the image and signing it is worse than
    # either.
    concurrency:
      group: release-image
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      # Keyless cosign: the OIDC token is the signing identity, so there is no
      # long-lived key anywhere. Needed only by this job.
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The step below compares two histories, and the default fetch is one
          # commit deep, which shares none of either.
          fetch-depth: 0

      # The checks above say the tagged tree passes its own tests; they say
      # nothing about how that tree got there. A `v*` tag can be pushed at any
      # commit in the repository, including one on a branch that never opened a
      # pull request, and this job would sign that commit and move `:latest`
      # onto it. The other release path builds what main has just merged, so
      # this is the only door that needs the lock.
      - name: Refuse a tag whose commit is not on main
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not reachable from main, so nothing on the branch ever saw it; no image was pushed"
            exit 1
          fi

      # `:latest` is what README.md hands a new reader and what SECURITY.md
      # calls the supported version, so it has to name the newest release
      # rather than the last one to reach the registry. Those come apart
      # whenever the publish order is not the release order: two releases cut
      # minutes apart finish their checks in whichever order their runners
      # take, a re-run of a flaked check runs after the later release has
      # landed, and a tag pushed at an old commit has nothing to race at all.
      # The comparison is against the tags on origin rather than against images
      # that exist, so a tag that never produced one holds the floating tag
      # where it is until a higher version is cut; that is why declining to
      # move it is a warning and not a silent skip.
      - name: Decide whether this release moves :latest
        id: tags
        run: |
          set -euo pipefail
          newest=$(git ls-remote --tags --refs --sort=-v:refname origin 'v*' |
            awk 'NR == 1 { sub(/.*refs\/tags\//, "", $2); print $2 }')
          if [ -z "$newest" ]; then
            echo "::error::origin carries no vX.Y.Z tag, so there is nothing to compare $GITHUB_REF_NAME against"
            exit 1
          fi
          # Which of the two is higher, rather than whether this tag is the one
          # at the top: a tag pushed a moment ago need not be listed yet, and
          # not moving `:latest` for the newest release is the worse mistake.
          highest=$(printf '%s\n%s\n' "$newest" "$GITHUB_REF_NAME" | sort -V | tail -n 1)
          {
            echo 'list<<END_OF_TAG_LIST'
            echo "${IMAGE}:${GITHUB_REF_NAME}"
            if [ "$highest" = "$GITHUB_REF_NAME" ]; then
              echo "${IMAGE}:latest"
            fi
            echo END_OF_TAG_LIST
          } >> "$GITHUB_OUTPUT"
          if [ "$highest" != "$GITHUB_REF_NAME" ]; then
            echo "::warning::$newest is a later release than $GITHUB_REF_NAME, so :latest was left where it is"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          sbom: true
          provenance: mode=max
          # No cache: every job that runs on main can write the shared Actions
          # cache, so a layer restored from it is a way for code that is not in
          # this repository to reach a signed image. It would save the module
          # download and nothing else, since the source and the version stamp
          # change on every release.

      # The cosign version is whatever this action pins (see its action.yml), so
      # digest-pinning the action pins cosign too.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the index digest, which is what the tags above resolve to. The
      # annotations name the release inside what the signature covers, for the
      # reason written beside the same step in release-please.yaml: a
      # certificate identity says which workflow built an image, never which
      # version, so a moved tag verifies as whatever it now points at.
      - name: Sign the image (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          cosign sign --yes \
            -a "version=${TAG}" \
            -a "commit=${GITHUB_SHA}" \
            "${IMAGE}@${DIGEST}"

      # Run the exact command docs/verifying-releases.md tells third parties to
      # run. github.workflow_ref expands to the documented certificate identity
      # (Yornik/soiree/.github/workflows/ci.yaml@refs/tags/vX.Y.Z), so if the
      # doc is wrong or the signature is unusable, the release fails here.
      - name: Verify the signature the way a third party would
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          # -a is what turns "built by this workflow" into "built by this
          # workflow as this release": cosign answers `missing or incorrect
          # annotation` for any other version, so asking for it on the tag is
          # what a moved tag fails.
          for ref in "${IMAGE}@${DIGEST}" "${IMAGE}:${TAG}"; do
            cosign verify \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              -a "version=${TAG}" \
              "$ref" > /dev/null
            echo "verified (exact identity and version): $ref"
          done
          # The regexp form is what a reader who does not know which workflow
          # cut the release will paste. Kept byte-identical to the doc so this
          # fails if the two drift apart.
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/Yornik/soiree/\.github/workflows/(release-please|ci)\.yaml@refs/(heads/main|tags/v.+)$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-repository 'Yornik/soiree' \
            -a "version=${TAG}" \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "verified (documented regexp form): ${IMAGE}@${DIGEST}"

  # Separate job purely so contents:write lives nowhere near the build. The SBOM
  # is already attached to the image as an attestation; this republishes that
  # same document as a release asset so it can be read without pulling anything.
  release-sbom:
    name: Publish SBOM as a release asset
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: release-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the SBOM attestation from the pushed image
        env:
          DIGEST: ${{ needs.release-image.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
            --format '{{ json .SBOM }}' > sbom.raw.json
          # Single-platform builds nest the document under .SPDX; multi-platform
          # ones key it by platform first. Accept either, reject anything else.
          jq 'if has("SPDX") then .SPDX
              else ([.[] | select(type == "object" and has("SPDX")) | .SPDX] | first)
              end' sbom.raw.json > "soiree-${TAG}-sbom.spdx.json"
          # Fail loudly rather than attaching an empty or null asset.
          jq -e '.spdxVersion and (.packages | length > 0)' \
            "soiree-${TAG}-sbom.spdx.json" > /dev/null
          echo "extracted SBOM for ${IMAGE}@${DIGEST}"

      - name: Attach the SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "soiree-${TAG}-sbom.spdx.json" --clobber
          else
            echo "::notice::no GitHub Release exists for $TAG, so there is nothing to attach the SBOM to; it remains available as an image attestation"
          fi
