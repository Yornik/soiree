name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

# Keep in step with the Dockerfile, or the tested toolchain differs from the
# shipped one. Renovate tracks both (see customManagers in renovate.json).
env:
  GO_VERSION: '1.27'
  IMAGE: ghcr.io/yornik/soiree

# Every action is pinned to a commit digest, not a tag: a tag is mutable and
# whoever can move it can run arbitrary code with this workflow's token. The
# trailing comment is the human-readable version, and is the exact format
# Renovate reads and rewrites (helpers:pinGitHubActionDigests in renovate.json).

jobs:
  lint:
    name: Lint (golangci-lint)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: gofmt -l . | tee /tmp/fmt.out && test ! -s /tmp/fmt.out
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  test:
    name: Test (go test)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -race -cover ./...

  # The Go tests prove the right bytes are served. They cannot prove the page
  # works, and soiree is mostly frontend — so this drives the real binary in a
  # real browser. The suite lives in e2e/ and is outside the Go module: it adds
  # nothing to go.mod, so neither `go test ./...` nor the image build notice it.
  #
  # Blocking, like every other job here, and with no retry budget. The app is
  # static, makes no third-party requests and has no animation, so the usual
  # sources of browser-test flake are absent; every wait in the suite is on a
  # condition rather than on a clock. A job that is allowed to fail is a job
  # nobody reads, and an unread test is a deleted test. If it ever does turn
  # flaky, `continue-on-error: true` here is the honest stopgap — better than
  # papering over it with retries.
  #
  # A failing `playwright install` is infrastructure, not test logic: re-run
  # the job rather than treating it as a finding.
  browser:
    name: Browser tests (Playwright)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Playwright builds and starts the real binary itself, so this job needs
      # the same toolchain the others use.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # From the lockfile, so CI runs the versions that were reviewed.
      - name: Install the test harness
        working-directory: e2e
        run: npm ci

      # The browser is pinned by the Playwright version in that lockfile, so it
      # moves only when a reviewed dependency bump moves it.
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run the browser tests
        working-directory: e2e
        run: npm test

      # Traces are kept only for failures, so this is usually a near-empty
      # upload — and exactly what is wanted on the run where it is not.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  vuln:
    name: Vulnerabilities (govulncheck)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Reports only vulnerabilities actually reachable from this code, so a
      # finding here is real rather than a CVE in an unused code path.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    name: Build image (validate)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: soiree:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A green unit test suite does not prove the image boots. Start it and
      # check that configuration actually reaches the rendered page.
      - name: Smoke test the image
        run: |
          docker run -d --name soiree-ci -p 8080:8080 \
            -e SOIREE_EVENT_NAME='CI Smoke Test' \
            -e SOIREE_EVENT_DATE='2030-01-01T00:00:00Z' \
            soiree:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q 'CI Smoke Test'
          curl -fsS http://localhost:8080/sw.js >/dev/null
          echo "image serves configured content"
          docker rm -f soiree-ci

  # The claim "-trimpath, CGO_ENABLED=0, fixed toolchain" is only worth
  # something if it is checked. Build the binary twice from the same source and
  # compare the bytes, so an accidental source of nondeterminism (an embedded
  # timestamp, a generated file, VCS stamping) fails a PR instead of quietly
  # making releases unverifiable.
  #
  # Scope, honestly: this asserts that the *binary* is bit-identical, not that
  # the image digest is. BuildKit stamps the build time into the image config,
  # so two builds produce different image digests unless SOURCE_DATE_EPOCH and
  # timestamp rewriting are in play. The binary is the part that matters for
  # "does this image contain the code it claims to".
  reproducible:
    name: Reproducible build (binary is bit-identical)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Two independent builder instances, each with its own cache. Sharing one
      # builder risks BuildKit short-circuiting the second build and comparing a
      # hash to itself, which would make this check pass vacuously.
      - name: Create two independent builders
        run: |
          set -euo pipefail
          docker buildx create --name repro-a --driver docker-container
          docker buildx create --name repro-b --driver docker-container

      # type=local exports the final (scratch) stage's filesystem, which is just
      # the binary — no image load needed. Export outside the workspace: writing
      # out-a/ into the checkout would put it in build B's context and the two
      # builds would no longer be comparing like with like.
      - name: Build twice
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for b in a b; do
            docker buildx build \
              --builder "repro-$b" \
              --no-cache \
              --build-arg VERSION=repro \
              --build-arg "COMMIT=${COMMIT}" \
              --output "type=local,dest=${RUNNER_TEMP}/out-$b" \
              .
          done

      - name: Compare the two binaries
        run: |
          set -euo pipefail
          a=$(sha256sum "${RUNNER_TEMP}/out-a/soiree" | cut -d' ' -f1)
          b=$(sha256sum "${RUNNER_TEMP}/out-b/soiree" | cut -d' ' -f1)
          echo "build A: $a"
          echo "build B: $b"
          if [ "$a" != "$b" ]; then
            echo "::error::the build is not reproducible: two builds of the same source produced different binaries"
            ls -l "${RUNNER_TEMP}/out-a/soiree" "${RUNNER_TEMP}/out-b/soiree"
            exit 1
          fi
          echo "reproducible: both builds produced $a"

  # Reliable release path: pushing a vX.Y.Z tag builds + pushes the semver
  # image. (release-please's own tags are made with GITHUB_TOKEN, so it builds
  # the image inside release-please.yaml instead; this covers manual releases.)
  release-image:
    name: Push and sign release image
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign: the OIDC token is the signing identity, so there is no
      # long-lived key anywhere. Needed only by this job.
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The cosign version is whatever this action pins (see its action.yml), so
      # digest-pinning the action pins cosign too.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the index digest, which is what both tags resolve to.
      - name: Sign the image (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Run the exact command docs/verifying-releases.md tells third parties to
      # run. github.workflow_ref expands to the documented certificate identity
      # (Yornik/soiree/.github/workflows/ci.yaml@refs/tags/vX.Y.Z), so if the
      # doc is wrong or the signature is unusable, the release fails here.
      - name: Verify the signature the way a third party would
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          for ref in "${IMAGE}@${DIGEST}" "${IMAGE}:${TAG}"; do
            cosign verify \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$ref" > /dev/null
            echo "verified (exact identity): $ref"
          done
          # The regexp form is what a reader who does not know which workflow
          # cut the release will paste. Kept byte-identical to the doc so this
          # fails if the two drift apart.
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/Yornik/soiree/\.github/workflows/(release-please|ci)\.yaml@refs/(heads/main|tags/v.+)$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-repository 'Yornik/soiree' \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "verified (documented regexp form): ${IMAGE}@${DIGEST}"

  # Separate job purely so contents:write lives nowhere near the build. The SBOM
  # is already attached to the image as an attestation; this republishes that
  # same document as a release asset so it can be read without pulling anything.
  release-sbom:
    name: Publish SBOM as a release asset
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: release-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the SBOM attestation from the pushed image
        env:
          DIGEST: ${{ needs.release-image.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
            --format '{{ json .SBOM }}' > sbom.raw.json
          # Single-platform builds nest the document under .SPDX; multi-platform
          # ones key it by platform first. Accept either, reject anything else.
          jq 'if has("SPDX") then .SPDX
              else ([.[] | select(type == "object" and has("SPDX")) | .SPDX] | first)
              end' sbom.raw.json > "soiree-${TAG}-sbom.spdx.json"
          # Fail loudly rather than attaching an empty or null asset.
          jq -e '.spdxVersion and (.packages | length > 0)' \
            "soiree-${TAG}-sbom.spdx.json" > /dev/null
          echo "extracted SBOM for ${IMAGE}@${DIGEST}"

      - name: Attach the SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "soiree-${TAG}-sbom.spdx.json" --clobber
          else
            echo "::notice::no GitHub Release exists for $TAG, so there is nothing to attach the SBOM to; it remains available as an image attestation"
          fi
