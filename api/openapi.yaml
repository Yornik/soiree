  ############################################################################
  # Activity
  ############################################################################

  /activity:
    get:
      tags: [accounts]
      operationId: listActivity
      summary: Read what changed, newest first.
      description: |
        This is the history of the whole plan. Each write to the plan makes one
        entry. An entry says who made the change, when, to which row, and the
        value of each field before and after.

        Only an admin reads this. An entry names an account, and only an admin
        reads the list of accounts.

        The answer is one page. To read the next page, send the `nextBefore` of
        this page as `before`. When `nextBefore` is `null`, there is no older
        entry.

        The values use the same form as the rest of this API. A field name is
        the name `GET /plan` uses, and an amount is a string in major units.

        An entry stays when its row is deleted, and when the account that made
        it is deleted. In the second case `actor.id` and `actor.email` become
        `null`, and `actor.kind` stays `user`.
      parameters:
        - name: limit
          in: query
          required: false
          description: The number of entries in one page.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          required: false
          description: |
            The `id` of an entry. The page holds entries older than this one.
            Omit it for the newest page.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: One page of entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  ############################################################################
  # Attachments
  ############################################################################

  /attachments:
    post:
      tags: [attachments]
      operationId: beginAttachment
      summary: Start an upload.
      description: |
        This is the first of three steps.

        1. Call this. The answer holds an address (`upload.url`) and the
           headers to send.
        2. Send the file to that address with `PUT`. Send the headers exactly
           as given. Do not send the session cookie: the address is in the
           object store, and not in this API.
        3. Call `POST /attachments/{id}/complete`.

        The address accepts one body of exactly `size` bytes and of exactly
        `contentType`. The object store refuses any other body. The address
        stops working at `upload.expiresAt`.

        Name one parent: `budgetItemId` or `taskId`, and not both.

        The server cleans `name`. It removes a directory part and characters
        that do not show. The answer holds the name as stored.

        The attachment counts against the total size from this moment. It is
        not in the plan until step 3 succeeds. The server removes an upload
        that is not completed within one hour.

        A viewer cannot call this.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentBegin'
      responses:
        '201':
          description: The attachment as recorded, and where to send the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentBegun'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            The file does not fit in the space that remains. The code is
            `quota_exceeded`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '413':
          description: |
            The file is larger than one file can be on this deployment, or
            the request body is larger than 64 KiB. The code is
            `payload_too_large` in both cases. The page configuration holds
            the file limit (`attachments.maxBytes`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /attachments/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [attachments]
      operationId: completeAttachment
      summary: Confirm an upload.
      description: |
        Call this after the `PUT` succeeds. Send no body.

        The server asks the object store for the file. If the file is there
        and has the size you declared, the attachment is ready: it is in the
        plan, in the change history, and on `GET /events`.

        If no file is there, or the size is different, the server deletes the
        attachment and the file. Start again with `POST /attachments`.

        If the object store does not answer, nothing is deleted. Call this
        again.

        A second call for an attachment that is ready gives the same answer.
      responses:
        '200':
          description: The attachment, ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            No file arrived, or the file has a different size. The code is
            `upload_incomplete`. The attachment is deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: |
            The object store did not answer. The code is `storage_unavailable`.
            The attachment is kept. Call again after `Retry-After` seconds.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /attachments/{id}/content:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [attachments]
      operationId: getAttachmentContent
      summary: Get the file.
      description: |
        The answer is a redirect to the file in the object store. The address
        in `Location` works for one minute and needs no session. An ordinary
        link to this path downloads the file.

        The browser saves the file under its name. It does not show the file.

        With `inline=1`, the browser shows the file, if the attachment is
        `viewable`. For an attachment that is not `viewable`, `inline=1` does
        nothing: the browser saves the file. The server decides this. The type
        the file was stored with does not.

        Every role reads a file. An attachment that is not ready answers `404`.
      parameters:
        - name: inline
          in: query
          required: false
          description: Send `1` to show a `viewable` file in the browser.
          schema:
            type: string
            enum: ['1']
      responses:
        '303':
          description: Go to `Location` for the file.
          headers:
            Location:
              description: The file in the object store. It works for one minute.
              schema: { type: string, format: uri }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attachments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [attachments]
      operationId: deleteAttachment
      summary: Delete an attachment.
      description: |
        This deletes the record and the file.

        It takes no `revision`. An attachment is added or deleted, and never
        changed, so it has no revision to be stale.

        When you delete a budget item or a task, its attachments go with it.
        You do not delete them first.

        A viewer cannot call this.
      responses:
        '204':
          description: Deleted.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  ############################################################################
  # Web push
  ############################################################################

  /push/subscriptions:
    post:
      tags: [push]
      operationId: subscribePush
      summary: Register this browser for the digest.
      description: |
        Send the `PushSubscription` of the browser, as `JSON.stringify()`
        produces it.

        Every role registers. The role decides who receives the digest at the
        time it goes out, so a viewer who becomes an admin later starts to
        receive it without a new registration.

        Register again with the same endpoint to refresh it. The server keeps
        one subscription for one endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscription'
      responses:
        '204':
          description: The subscription is stored.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [push]
      operationId: unsubscribePush
      summary: Stop the digest on this browser.
      description: |
        Send the endpoint of the subscription as `?endpoint=`. A delete carries
        no body in this API. The revision of a row travels the same way.

        The server deletes the subscription of the current account that has
        that endpoint. It does not delete the subscription of another account.

        This operation succeeds for an endpoint the server does not hold.

        Call this first, and `unsubscribe()` in the browser second. The other
        order leaves a row that the digest sends to until the push service
        reports it gone.
      parameters:
        - name: endpoint
          in: query
          required: true
          description: |
            The `endpoint` of the `PushSubscription`. It is an absolute https
            URL. Encode it.
          schema:
            type: string
            format: uri
      responses:
        '204':
          description: The subscription is gone.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: soiree_session
      description: |
        The session cookie. `POST /auth/login` sets it, and
        `POST /auth/passkeys/login/finish` sets it.

        The cookie is HttpOnly, Secure and SameSite=Lax. A script cannot read
        it. A browser sends it by itself.

        The name carries no `__Host-` prefix. That prefix demands HTTPS. A
        plain `docker run` on `localhost` has none, and a browser accepts a
        `Secure` cookie there without the prefix.

  parameters:
    RevisionQuery:
      name: revision
      in: query
      required: true
      description: |
        The revision you read. A delete names the row it deletes, in the same
        way as a write.

        A delete carries no body, so this is a query parameter rather than a
        field. It is required. A delete with no revision is a delete that
        cannot tell a stale row from a current one.
      schema:
        type: integer
        format: int64
        minimum: 1
    Id:
      name: id
      in: path
      required: true
      description: The id of the row.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: |
        The body does not parse, a field is unknown, a field holds the wrong
        type, or a value fails a rule. Read `message`.

        A value the database itself refuses as data is a **400** as well, not
        a **500**: a figure past what its column holds, a NUL byte in a text
        field. It is the value that has to change, and only you can change it.

        On the plan, the collections and the settings, the code is
        `bad_request`.

        On the push paths, the code is `invalid_json` when the body does not
        parse, and `bad_request` when a value fails a rule.

        On the accounts paths the code names the fault: `invalid_json`,
        `invalid_email`, `invalid_role`, `invalid_status`, `invalid_language`,
        `revision_required`, `self_change`, `invalid_token`, `weak_password`,
        `invalid_passkey` or `invalid_challenge`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

    Unauthorized:
      description: |
        There is no session. Sign in. The code is `unauthenticated`.

        A 401 means this deployment has an API. Do not fall back to local
        storage on a 401. Fall back on a **404**, which means the deployment
        runs without a database.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

    Forbidden:
      description: |
        The session exists, and the role is too low. A viewer writes nothing.
        An admin alone manages accounts.

        The code is `read_only` when a viewer tries to write, and `forbidden`
        when a role is below the one a route needs.

        The code is `cross_origin` when a browser sent the write from another
        origin. The role is not the cause, and every write can get this
        answer, including the writes that need no session. See "A write comes
        from this origin" above.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

    RevisionRequired:
      description: |
        The `revision` is missing, or it will not parse. The code is
        `bad_request` on a collection, and `revision_required` on an account.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

    NotFound:
      description: |
        The row does not exist. The code is `not_found`.

        A whole-path 404 means something else. See "The API is absent without
        a database" above.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

    TooManyRequests:
      description: |
        A rate limit refused the request. The code is `rate_limited`.

        Wait for `Retry-After`, then retry. The header reads a flat 60. The
        bucket refills continuously, so the real wait is usually shorter — a
        precise number would mostly help somebody pacing an attack against it.
      headers:
        Retry-After:
          description: Seconds to wait. It is always `60`.
          schema:
            type: integer
            examples: [60]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

    StaleRevision:
      description: |
        Somebody wrote first. The code is `stale_revision`.

        Read `current`. It holds the row as it now stands, with its new
        revision. Reconcile against it, and write again with that revision. A
        call to `GET /plan` is unnecessary.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

    PayloadTooLarge:
      description: |
        The request body is larger than 64 KiB. The code is
        `payload_too_large`.

        The limit is on the whole body. The largest body this API expects is
        a note of a few paragraphs.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

    BudgetItemTaken:
      description: |
        The `budgetItemId` belongs to another entry of the programme. The
        code is `conflict`.

        One budget item belongs to at most one entry. Clear the budget item
        on the other entry first.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

    ProgrammeEntryConflict:
      description: |
        Somebody wrote first, or the `budgetItemId` belongs to another entry.
        Read `error` to tell the two apart.

        The code is `stale_revision` when somebody wrote first. Read
        `current`, reconcile against it, and write again with the revision it
        carries.

        The code is `conflict` when the budget item belongs to another entry
        of the programme. One budget item belongs to at most one entry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

    LinkFailed:
      description: |
        The account exists. The server did not make the set-password link.
        The code is `link_failed`.

        Call `POST /users/{id}/invite` to make a link. Do not create the
        account again: the account is there, and a second `POST /users` gets
        **409** `email_taken`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

    PhaseCreated:
      description: The phase exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Phase' }
    SponsorCreated:
      description: The sponsor exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Sponsor' }
    BudgetItemCreated:
      description: The budget item exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BudgetItem' }
    ProgrammeEntryCreated:
      description: The entry exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProgrammeEntry' }
    TaskCreated:
      description: The task exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Task' }
    NoteCreated:
      description: The note exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Note' }

  schemas:

    ########################################################################
    # Building blocks
    ########################################################################

    Money:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      description: |
        An amount in **major units**, as a decimal string.

        Send `"250.50"`. Do not send `250.50`. The server refuses a JSON
        number here.

        The number of decimal places comes from the currency of the
        deployment. A value with too many places gets 400.
      examples: ['250.50', '750000', '0.00']

    CivilDate:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      description: |
        A calendar date. It carries no time and no zone.

        A timestamp would read as the day before, east of UTC.
      examples: ['2030-01-15']

    Revision:
      type: integer
      format: int64
      minimum: 1
      description: |
        The version of this row. It increases on every write.

        Send the revision you read. A stale revision gets 409.

    Id:
      type: string
      format: uuid
      description: The id of the row.

    UpdatedBy:
      type: [string, 'null']
      format: uuid
      description: |
        The id of the account that wrote this row last. It is `null` for a row
        that no account has touched.

        This is an id, and never an address. The change log outlives the
        account.

    Role:
      type: string
      enum: [admin, editor, viewer]
      description: |
        `admin` manages the accounts, and reads and writes the plan. The
        digest goes to every active admin.

        `editor` reads and writes the plan.

        `viewer` reads the plan.

    Language:
      type: [string, 'null']
      description: |
        The language of one mail, and of the page that the link in it opens.

        It belongs to the request that sends the mail. The server does not
        store it, and an account has no language. `null`, or no field, means
        the language of the deployment.

        Send a bare tag. The server also accepts a locale, such as `nl-NL`,
        and keeps the language part.
      enum: [en, nl, id, null]
      examples: [nl]

    UserStatus:
      type: string
      enum: [invited, active, disabled]
      description: |
        `invited` holds no password yet. The person redeems the token from the
        invitation mail.

        `active` signs in.

        `disabled` signs in with nothing, and takes no invitation. The history
        of the account stays.

    TaskStatus:
      type: string
      enum: [not-started, in-progress, done]
      description: The state of a task. A new task starts at `not-started`.

    Position:
      type: integer
      format: int32
      description: |
        The order of this row among its siblings. A lower number comes first.

        The server allocates nothing. A create that omits `position` gets 0,
        and 0 comes first. Read the collection, and send one more than the
        highest `position` in it to put the new row last.

        Two rows that hold the same position come back in the order of their
        ids. That order is stable, and it says nothing about which row was
        made first.

    ########################################################################
    # Activity
    ########################################################################

    ActivityPage:
      type: object
      required: [entries, nextBefore]
      additionalProperties: false
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/ActivityEntry' }
        nextBefore:
          type: [integer, 'null']
          format: int64
          description: |
            Send this as `before` to read the next page. It is `null` when this
            page is not full, because then no older entry exists.

    ActivityEntry:
      type: object
      description: One change to one row.
      required: [id, at, entity, entityId, action, label, actor, changes]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          description: The order of the entries. A larger number is newer.
        at: { type: string, format: date-time }
        entity:
          type: string
          enum: [attachments, budget_items, notes, phases, programme_entries, settings, sponsors, tasks, users]
          description: |
            The table that changed. `users` is here and is not on
            `GET /events`: an account is not part of the plan.
        entityId:
          type: [string, 'null']
          format: uuid
          description: The id of the row. It is `null` for `settings`.
        action:
          type: string
          enum: [create, update, delete]
        label:
          type: [string, 'null']
          description: |
            The name of the row after this change: the item of a budget item,
            the name of a task, the email of an account. It is the name at that
            time, and not the name now. It is `null` for `settings`. A long
            name is cut to 120 characters.
        actor:
          type: object
          required: [id, email, kind]
          additionalProperties: false
          properties:
            id: { type: [string, 'null'], format: uuid }
            email:
              type: [string, 'null']
              description: The address of the account now. It is not the address at that time.
            kind:
              type: string
              description: |
                `user` for an account. `system` and `import` for the server
                itself. `unknown` for a write with no session behind it.
              examples: [user, system, import, unknown]
        changes:
          type: array
          description: |
            One item for each field that changed, in the order of `field`. On a
            `create`, each `old` is `null`. On a `delete`, each `new` is
            `null`. A password is never here: where `passwordHash` has a
            value, that value is the word `"redacted"`. A value is spoken as
            the rest of this API speaks it: an amount is a decimal string in
            major units, and a date is a `YYYY-MM-DD` day.
          items:
            type: object
            required: [field, old, new]
            additionalProperties: false
            properties:
              field: { type: string, example: paid }
              old: { description: The value before. Its type is the type of the field. }
              new: { description: The value after. Its type is the type of the field. }

    ########################################################################
    # Attachments
    ########################################################################

    Attachment:
      type: object
      description: |
        One file on a budget item or on a task. Exactly one of `budgetItemId`
        and `taskId` holds an id. The other is `null`.
      required: [id, budgetItemId, taskId, name, contentType, size, viewable, uploadedBy, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        budgetItemId: { type: [string, 'null'], format: uuid }
        taskId: { type: [string, 'null'], format: uuid }
        name:
          type: string
          description: The file name, as the server cleaned it.
        contentType:
          type: string
          description: |
            The type the uploader gave. It is `application/octet-stream` when
            the uploader gave none. It does not decide how the file is served:
            see `viewable`.
          example: application/pdf
        size:
          type: integer
          format: int64
          description: The length of the file in bytes.
        viewable:
          type: boolean
          description: |
            `true` if `GET /attachments/{id}/content?inline=1` shows the file
            in the browser. This is `true` for JPEG, PNG, WebP and GIF images
            and for PDF. It is `false` for every other type.
        uploadedBy:
          type: [string, 'null']
          format: uuid
          description: |
            The account that uploaded the file. It is `null` after that
            account is deleted.
        createdAt: { type: string, format: date-time }

    AttachmentBegin:
      type: object
      description: |
        What you send to start an upload. An unknown field is a `400`.
      required: [name, size]
      additionalProperties: false
      properties:
        budgetItemId:
          type: [string, 'null']
          format: uuid
          description: The budget item. Send this or `taskId`, and not both.
        taskId:
          type: [string, 'null']
          format: uuid
          description: The task. Send this or `budgetItemId`, and not both.
        name:
          type: string
          description: The file name. The server cleans it.
        size:
          type: integer
          format: int64
          minimum: 1
          description: The length of the file in bytes. It must be exact.
        contentType:
          type: string
          description: |
            The type of the file. Send what the browser reports. An empty
            value is stored as `application/octet-stream`.

    AttachmentBegun:
      type: object
      required: [attachment, upload]
      additionalProperties: false
      properties:
        attachment: { $ref: '#/components/schemas/Attachment' }
        upload:
          type: object
          description: Where to send the file, and how.
          required: [url, method, headers, expiresAt]
          additionalProperties: false
          properties:
            url:
              type: string
              format: uri
              description: |
                An address in the object store. It is a secret until it
                expires: a person who holds it can send the file.
            method:
              type: string
              enum: [PUT]
            headers:
              type: object
              description: |
                Send each of these exactly as given. They are part of the
                signature of the address.
              additionalProperties: { type: string }
              example: { Content-Type: application/pdf }
            expiresAt: { type: string, format: date-time }

    ########################################################################
    # Errors
    ########################################################################

    ApiError:
      type: object
      description: |
        The body of every answer that an operation in this document gives
        outside the 2xx range. One shape, so a client never guesses.

        This document does not list **500** on each operation. An operation
        that reads or writes the database can answer it, with the code
        `internal` and no detail. The cause is in the log of the server.

        Two answers come from the router rather than from an operation, and
        both are `text/plain`. With a session, a path under `/api/v1` that no
        route serves gets **404**, and a method that a route does not have
        gets **405** with an `Allow` header. Read `Content-Type` before you
        parse a refusal.
      required: [error]
      properties:
        error:
          type: string
          description: |
            A stable code. Branch on this, and never on `message`.
          examples:
            - bad_request
            - not_found
            - stale_revision
            - payload_too_large
            - quota_exceeded
            - upload_incomplete
            - storage_unavailable
            - conflict
            - internal
            - unauthenticated
            - read_only
            - forbidden
            - cross_origin
            - rate_limited
            - revision_required
            - self_change
            - unavailable
            - invalid_json
            - invalid_email
            - invalid_role
            - invalid_status
            - invalid_language
            - invalid_passkey
            - invalid_challenge
            - invalid_credentials
            - invalid_token
            - weak_password
            - email_taken
            - account_disabled
            - no_password
            - link_failed
            - too_many_passkeys
            - passkey_exists
        message:
          type: string
          description: |
            A line for a person to read. It is absent on some errors. The
            wording changes between releases.
        current:
          description: |
            The row as it now stands. It is present on a 409 with the code
            `stale_revision`, and absent otherwise.

            Reconcile against this. A call to `GET /plan` is unnecessary.

    ########################################################################
    # The plan
    ########################################################################

    Plan:
      type: object
      description: |
        The whole plan in one object. `GET /plan` returns this.
      required: [settings, phases, sponsors, budgetItems, programme, tasks, notes, attachments]
      properties:
        settings: { $ref: '#/components/schemas/Settings' }
        phases:
          type: array
          items: { $ref: '#/components/schemas/Phase' }
        sponsors:
          type: array
          items: { $ref: '#/components/schemas/Sponsor' }
        budgetItems:
          type: array
          items: { $ref: '#/components/schemas/BudgetItem' }
        programme:
          type: array
          items: { $ref: '#/components/schemas/ProgrammeEntry' }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        notes:
          type: array
          items: { $ref: '#/components/schemas/Note' }
        attachments:
          type: array
          description: |
            Every attachment that is ready, for every budget item and every
            task, oldest first. Find the attachments of a row by
            `budgetItemId` or `taskId`. The list is empty on a deployment with
            no object store.
          items: { $ref: '#/components/schemas/Attachment' }

    ChangeNotice:
      type: object
      description: |
        What one change says about itself on `GET /events`. It holds enough to
        know which row changed, and nothing more. It never holds the row.
      required: [entity, id, action, revision]
      additionalProperties: false
      properties:
        entity:
          type: string
          enum: [attachments, budget_items, notes, phases, programme_entries, settings, sponsors, tasks]
          description: |
            The table that changed. These are the names of the tables, with an
            underscore. They are not the names of the paths, which use a
            hyphen: `budget_items` here is `/budget-items` there.
        id:
          type: [string, 'null']
          format: uuid
          description: |
            The id of the row. It is `null` for `settings`, which is one row
            with no id.
        action:
          type: string
          enum: [create, update, delete]
        revision:
          type: [integer, 'null']
          format: int64
          description: |
            The revision the row now has. On a `delete` it is the last
            revision of the row. It is `null` for a row that carries no
            revision. An attachment carries none, so for `attachments` it is
            always `null`: read the plan again.

    Settings:
      type: object
      description: |
        The settings of the plan. There is one row.
      required: [ceiling, inflationPct, fxRate, splitEvenly, revision, updatedAt]
      properties:
        ceiling:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |
            The spending ceiling, in major units. `"0"` means no ceiling.
        inflationPct:
          type: number
          format: double
          description: |
            The allowance for a price rise, as a percentage. `5` means five
            percent. This is not money, so it is a number.
        fxRate:
          type: number
          format: double
          description: |
            The rate that converts the primary currency into the second
            readout. It is a number, because it multiplies rather than pays.
        splitEvenly:
          type: boolean
          description: |
            `true` divides a shared line between its sponsors in the totals.

            The total of one sponsor always divides a shared line, whatever
            this says.
        revision: { $ref: '#/components/schemas/Revision' }
        updatedAt:
          type: string
          format: date-time

    SettingsPatch:
      type: object
      additionalProperties: false
      description: |
        A change to the settings.

        Omit a field to leave it as it is. `{}` changes nothing.
      required: [revision]
      properties:
        revision: { $ref: '#/components/schemas/Revision' }
        updatedAt:
          type: string
          format: date-time
          description: Accepted and dropped. The server sets it.
        ceiling: { $ref: '#/components/schemas/Money' }
        inflationPct:
          type: number
          format: double
        fxRate:
          type: number
          format: double
        splitEvenly:
          type: boolean

    Phase:
      type: object
      description: A phase groups the budget items.
      required: [id, name, position, revision, updatedAt, updatedBy]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        position: { $ref: '#/components/schemas/Position' }
        revision: { $ref: '#/components/schemas/Revision' }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: '#/components/schemas/UpdatedBy' }

    PhaseWrite:
      type: object
      additionalProperties: false
      description: |
        A new phase, or a change to one.

        Send `revision` on a change. Omit it on a create.
      properties:
        revision: { $ref: '#/components/schemas/Revision' }
        id:
          $ref: '#/components/schemas/Id'
          description: Accepted and dropped. The path names the row.
        updatedAt:
          type: string
          format: date-time
          description: Accepted and dropped. The server sets it.
        updatedBy:
          $ref: '#/components/schemas/UpdatedBy'
          description: Accepted and dropped. The session names the account.
        name: { type: string }
        position: { $ref: '#/components/schemas/Position' }

    Sponsor:
      type: object
      description: A sponsor pays for budget items.
      required: [id, code, name, position, revision, updatedAt, updatedBy]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code:
          type: string
          description: |
            The short label the table shows. Two sponsors can hold the same
            label.
        name: { type: string }
        position: { $ref: '#/components/schemas/Position' }
        revision: { $ref: '#/components/schemas/Revision' }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: '#/components/schemas/UpdatedBy' }

    SponsorWrite:
      type: object
      additionalProperties: false
      description: |
        A new sponsor, or a change to one.

        Send `revision` on a change. Omit it on a create.
      properties:
        revision: { $ref: '#/components/schemas/Revision' }
        id:
          $ref: '#/components/schemas/Id'
          description: Accepted and dropped. The path names the row.
        updatedAt:
          type: string
          format: date-time
          description: Accepted and dropped. The server sets it.
        updatedBy:
          $ref: '#/components/schemas/UpdatedBy'
          description: Accepted and dropped. The session names the account.
        code:
          type: string
          description: The short label. Two sponsors can hold the same label.
        name: { type: string }
        position: { $ref: '#/components/schemas/Position' }

    BudgetItem:
      type: object
      description: |
        One line of the budget.

        `unit` and `paid` are money. `qty` is a number.
      required:
        [id, phaseId, parentId, item, vendor, unit, qty, paid, lockBy, note,
         position, sponsors, revision, updatedAt, updatedBy]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        phaseId:
          type: [string, 'null']
          format: uuid
          description: |
            The phase of this line. It is `null` for a line in no phase.
        parentId:
          type: [string, 'null']
          format: uuid
          description: |
            The line this one sits under. It is `null` for a top-level line.

            A delete of the parent deletes this line with it.
        item: { type: string }
        vendor: { type: string }
        unit:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: The price of one unit, in major units.
        qty:
          type: number
          format: double
          description: |
            The count of units. This is not money. Nobody pays in it, and
            nothing sums it, so it stays a JSON number.
        paid:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: The amount paid so far, in major units.
        lockBy:
          oneOf:
            - { $ref: '#/components/schemas/CivilDate' }
            - { type: 'null' }
          description: |
            The date the price holds until. It is `null` for a line with no
            deadline.

            A line with a date enters the digest.
        note: { type: string }
        position: { $ref: '#/components/schemas/Position' }
        sponsors:
          type: array
          items: { type: string, format: uuid }
          description: |
            The sponsors that cover this line.

            An empty list reads as unassigned. Two or more sponsors make the
            line shared.
        revision: { $ref: '#/components/schemas/Revision' }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: '#/components/schemas/UpdatedBy' }

    BudgetItemWrite:
      type: object
      additionalProperties: false
      description: |
        A new budget item, or a change to one.

        Send `revision` on a change. Omit it on a create.

        Omit a field to leave it as it is. Send `null` to clear a field that
        accepts `null`.
      properties:
        revision: { $ref: '#/components/schemas/Revision' }
        id:
          $ref: '#/components/schemas/Id'
          description: Accepted and dropped. The path names the row.
        updatedAt:
          type: string
          format: date-time
          description: Accepted and dropped. The server sets it.
        updatedBy:
          $ref: '#/components/schemas/UpdatedBy'
          description: Accepted and dropped. The session names the account.
        phaseId:
          type: [string, 'null']
          format: uuid
        parentId:
          type: [string, 'null']
          format: uuid
        item: { type: string }
        vendor: { type: string }
        unit: { $ref: '#/components/schemas/Money' }
        qty:
          type: number
          format: double
          minimum: -999999999.999
          maximum: 999999999.999
          description: |
            The column holds twelve digits with three after the point. A
            bigger figure, or a fourth decimal, is a **400** naming the limit
            rather than a value the server rounds on your behalf.
        paid: { $ref: '#/components/schemas/Money' }
        lockBy:
          oneOf:
            - { $ref: '#/components/schemas/CivilDate' }
            - { type: 'null' }
        note: { type: string }
        position: { $ref: '#/components/schemas/Position' }
        sponsors:
          type: array
          items: { type: string, format: uuid }
          description: |
            The whole list. The server replaces the list it holds. Send `[]`
            to clear it.

    ProgrammeEntry:
      type: object
      description: One entry in the run of the day.
      required: [id, title, note, position, budgetItemId, revision, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        note: { type: string }
        position: { $ref: '#/components/schemas/Position' }
        budgetItemId:
          type: [string, 'null']
          format: uuid
          description: |
            The budget item this entry costs. It is `null` for an entry with
            no cost.

            One budget item belongs to at most one entry. A write that names
            a budget item another entry holds gets **409**.
        revision: { $ref: '#/components/schemas/Revision' }
        updatedAt: { type: string, format: date-time }

    ProgrammeEntryWrite:
      type: object
      additionalProperties: false
      description: |
        A new entry, or a change to one.

        Send `revision` on a change. Omit it on a create.
      properties:
        revision: { $ref: '#/components/schemas/Revision' }
        id:
          $ref: '#/components/schemas/Id'
          description: Accepted and dropped. The path names the row.
        updatedAt:
          type: string
          format: date-time
          description: Accepted and dropped. The server sets it.
        updatedBy:
          $ref: '#/components/schemas/UpdatedBy'
          description: Accepted and dropped. The session names the account.
        title: { type: string }
        note: { type: string }
        position: { $ref: '#/components/schemas/Position' }
        budgetItemId:
          type: [string, 'null']
          format: uuid

    Task:
      type: object
      description: One task on the plan.
      required: [id, name, owner, due, status, position, revision, updatedAt, updatedBy]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        owner:
          type: string
          description: |
            The person who holds this task, as free text. This is not an
            account.
        due:
          oneOf:
            - { $ref: '#/components/schemas/CivilDate' }
            - { type: 'null' }
          description: |
            The date the task falls due. It is `null` for a task with no date.

            A task with a date enters the digest.
        status: { $ref: '#/components/schemas/TaskStatus' }
        position: { $ref: '#/components/schemas/Position' }
        revision: { $ref: '#/components/schemas/Revision' }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: '#/components/schemas/UpdatedBy' }

    TaskWrite:
      type: object
      additionalProperties: false
      description: |
        A new task, or a change to one.

        Send `revision` on a change. Omit it on a create.

        A new task starts at `not-started` when you omit `status`.
      properties:
        revision: { $ref: '#/components/schemas/Revision' }
        id:
          $ref: '#/components/schemas/Id'
          description: Accepted and dropped. The path names the row.
        updatedAt:
          type: string
          format: date-time
          description: Accepted and dropped. The server sets it.
        updatedBy:
          $ref: '#/components/schemas/UpdatedBy'
          description: Accepted and dropped. The session names the account.
        name: { type: string }
        owner: { type: string }
        due:
          oneOf:
            - { $ref: '#/components/schemas/CivilDate' }
            - { type: 'null' }
        status: { $ref: '#/components/schemas/TaskStatus' }
        position: { $ref: '#/components/schemas/Position' }

    Note:
      type: object
      description: One free line of text on the plan.
      required: [id, text, position, revision, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        text: { type: string }
        position: { $ref: '#/components/schemas/Position' }
        revision: { $ref: '#/components/schemas/Revision' }
        updatedAt: { type: string, format: date-time }

    NoteWrite:
      type: object
      additionalProperties: false
      description: |
        A new note, or a change to one.

        Send `revision` on a change. Omit it on a create.
      properties:
        revision: { $ref: '#/components/schemas/Revision' }
        id:
          $ref: '#/components/schemas/Id'
          description: Accepted and dropped. The path names the row.
        updatedAt:
          type: string
          format: date-time
          description: Accepted and dropped. The server sets it.
        updatedBy:
          $ref: '#/components/schemas/UpdatedBy'
          description: Accepted and dropped. The session names the account.
        text: { type: string }
        position: { $ref: '#/components/schemas/Position' }

    ########################################################################
    # Accounts
    ########################################################################

    User:
      type: object
      description: One account.
      required: [id, email, role, status, createdBy, createdAt, revision, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        createdBy:
          type: [string, 'null']
          format: uuid
          description: |
            The admin who created this account. It is `null` for the first
            admin, which the deployment creates at startup.
        createdAt: { type: string, format: date-time }
        revision: { $ref: '#/components/schemas/Revision' }
        updatedAt: { type: string, format: date-time }

    UserPatch:
      type: object
      description: |
        A change to an account.

        Omit a field to leave it as it is.
      required: [revision]
      properties:
        revision: { $ref: '#/components/schemas/Revision' }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }

    Invite:
      type: object
      description: |
        The answer to a create and to an invitation.

        Read `mailSent` first. It decides whether you show the link.
      required: [user, mailSent]
      properties:
        user: { $ref: '#/components/schemas/User' }
        mailSent:
          type: boolean
          description: |
            `true` means the server sent the mail. `false` means the
            deployment holds no mail configuration.
        setPasswordUrl:
          type: string
          format: uri
          description: |
            The link that sets the password. It is present when `mailSent` is
            `false`, and absent otherwise.

            The link carries the token. It also carries `?lang=` when the
            request chose a language. Give it to the person by a private
            route. A deployment with mail omits it, so the token never reaches
            a log.

    Passkey:
      type: object
      description: One passkey of the current account.
      required: [id, label, transports, createdAt, lastUsedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        label:
          type: string
          description: The name of the passkey, for the person to recognise.
        transports:
          type: array
          items: { type: string }
          description: |
            How the authenticator connects. The list says `phone` rather than
            `passkey` three times.
          examples: [['internal'], ['hybrid'], ['usb']]
        createdAt: { type: string, format: date-time }
        lastUsedAt:
          type: [string, 'null']
          format: date-time
          description: |
            The last sign-in with this passkey. It is `null` for a passkey
            that nobody has used.

    ########################################################################
    # Web push
    ########################################################################

    PushSubscription:
      type: object
      description: |
        The `PushSubscription` of the browser, as `JSON.stringify()` produces
        it. Send it unchanged.
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          format: uri
          description: |
            The address of the push service. It identifies the subscription.
        expirationTime:
          type: [number, 'null']
          description: |
            The browser sets this. It is a count of milliseconds since the
            epoch, and it is `null` in most cases. The server accepts it and
            ignores it.
        keys:
          type: object
          required: [p256dh, auth]
          description: The keys that encrypt the payload.
          properties:
            p256dh:
              type: string
              description: The public key of the browser, in base64url.
            auth:
              type: string
              description: The authentication secret, in base64url.
